name: Deploy Registry to Sepolia (Manual)

# Manual-only deployment. This workflow never runs on push, pull_request,
# merge, or tag creation - only an explicit, human-triggered dispatch with
# a typed confirmation can deploy a new contract to Sepolia.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >
          Type exactly "DEPLOY-SEPOLIA" to confirm you want to deploy a NEW
          ProtocolProvenanceRegistry contract to Sepolia. This does not
          modify or replace any existing deployment - it only creates a new
          one. Anything else aborts the run before any network call is made.
        required: true

# Refuse to run two deployments at once.
concurrency:
  group: deploy-sepolia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Compile, test, and deploy to Sepolia
    runs-on: ubuntu-latest

    # Hard gate: the job does not start at all unless the confirmation
    # phrase was typed exactly. No network call happens before this check.
    if: github.event.inputs.confirm == 'DEPLOY-SEPOLIA'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Compile contracts
        env:
          # A syntactically valid placeholder only - hardhat.config.ts
          # validates networks.sepolia.url eagerly even for tasks (like
          # compile) that never touch the network. The real secret is not
          # needed, and is not used, here.
          SEPOLIA_RPC_URL: "http://127.0.0.1:8545"
        run: npx hardhat compile

      - name: Run Solidity test suite
        env:
          # Same placeholder as above - config validation only.
          SEPOLIA_RPC_URL: "http://127.0.0.1:8545"
        run: |
          set -e

          # test/ProtocolProvenanceRegistry.ts connects to a local JSON-RPC
          # node directly, so one must already be listening on :8545.
          npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          NODE_PID=$!

          echo "Waiting for local Hardhat node to accept connections..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' \
                 -X POST -H "Content-Type: application/json" \
                 --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                 http://127.0.0.1:8545 | grep -q 200; then
              echo "Node is up."
              break
            fi
            sleep 1
          done

          npx hardhat test
          TEST_EXIT_CODE=$?

          kill "$NODE_PID" 2>/dev/null || true

          exit $TEST_EXIT_CODE

      - name: Deploy via Hardhat Ignition
        id: deploy
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}
          # Hardhat Ignition prompts interactively for any non-local chain
          # unless this exact env var is set (see
          # @nomicfoundation/hardhat-ignition's deploy task source). This is
          # a separate, lower-level Hardhat prompt from - and does not
          # replace or weaken - the DEPLOY-SEPOLIA confirmation gate above,
          # which is the actual human authorization for this workflow run.
          HARDHAT_IGNITION_CONFIRM_DEPLOYMENT: "true"
        run: |
          set -e
          npx hardhat ignition deploy ignition/modules/ProtocolRegistry.ts --network sepolia

      - name: Extract deployed address
        id: address
        run: |
          set -e
          FILE="ignition/deployments/chain-11155111/deployed_addresses.json"

          if [ ! -f "$FILE" ]; then
            echo "::error::Deployment record not found at $FILE"
            exit 1
          fi

          ADDRESS=$(node -e "console.log(require('./$FILE')['ProtocolRegistryModule#ProtocolProvenanceRegistry'])")

          if [ -z "$ADDRESS" ] || [ "$ADDRESS" = "undefined" ]; then
            echo "::error::Could not read the deployed address from $FILE"
            exit 1
          fi

          echo "Deployed address: $ADDRESS"
          echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"

      - name: Verify deployment (read-only checks)
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: npx hardhat run scripts/verify-deployment.ts --network sepolia

      - name: Check for Etherscan API key
        # The `secrets` context cannot be referenced directly in an `if:`
        # condition (it's not in scope for expression evaluation there -
        # GitHub Actions rejects the workflow at parse time if you try).
        # Resolve presence into a step output instead, which `if:` can read.
        # Only a non-secret "true"/"false" string leaves this step.
        id: etherscan_key_check
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -n "$ETHERSCAN_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify contract on explorers
        # Only attempted if an Etherscan API key secret has actually been
        # configured for this repository.
        if: ${{ steps.etherscan_key_check.outputs.present == 'true' }}
        # The combined `hardhat verify` task runs every enabled provider
        # (etherscan, blockscout, sourcify - all enabled by default per
        # @nomicfoundation/hardhat-verify) and reports a single failure if
        # ANY of them errors, even if the others succeeded. Blockscout is a
        # secondary, external explorer that has been observed rate-limiting
        # (HTTP 429) independently of whether Etherscan verification (the
        # one that actually matters here) succeeded. Run each provider as
        # its own subtask instead, so each one's outcome can be handled on
        # its own terms:
        #   - Etherscan: required - its failure fails this step (and the job).
        #   - Sourcify: unchanged from prior behavior - informational only.
        #   - Blockscout: informational only - an external rate limit or
        #     outage on a secondary explorer must not fail an otherwise
        #     successful deployment that Etherscan already verified.
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -e
          ADDRESS="${{ steps.address.outputs.address }}"

          echo "=== Etherscan verification (required) ==="
          npx hardhat verify etherscan --network sepolia "$ADDRESS"

          echo "=== Sourcify verification (informational, non-blocking) ==="
          npx hardhat verify sourcify --network sepolia "$ADDRESS" \
            || echo "::warning::Sourcify verification did not succeed. Non-blocking - deployment remains valid."

          echo "=== Blockscout verification (informational, non-blocking) ==="
          npx hardhat verify blockscout --network sepolia "$ADDRESS" \
            || echo "::warning::Blockscout verification did not succeed (e.g. external rate limit). Non-blocking - deployment remains valid."

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Sepolia Deployment"
            echo ""
            echo "- **Network:** Sepolia (chain id 11155111)"
            echo "- **New contract address:** \`${{ steps.address.outputs.address }}\`"
            echo "- **Etherscan:** https://sepolia.etherscan.io/address/${{ steps.address.outputs.address }}"
            echo ""
            echo "This workflow only deployed a new contract. It did NOT update"
            echo "frontend/src/lib/contract.ts, README.md, or scripts/make-test-pdf.ts -"
            echo "those canonical references must be updated in a separate, reviewed commit."
          } >> "$GITHUB_STEP_SUMMARY"
